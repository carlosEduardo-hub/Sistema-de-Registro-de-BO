services:
  db:
    image: bitnami/postgresql:13.16.0
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: ssp_bo
    ports:
      - "5432:5432"
    volumes:
      - ./transcricao/docker/postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d ssp_bo -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./transcricao:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./transcricao/.env
    environment:
      DATABASE_URL: postgresql://docker:docker@db:5432/ssp_bo
      PORT: "3333"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3333:3333"
    command: >
      sh -c "npm install
      && npm run db:migrate
      && node --experimental-strip-types --no-warnings --loader=ts-node/esm src/server.ts"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./registro-remoto-de-bo:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:3333
    depends_on:
      - backend
    ports:
      - "8080:8080"
    command: >
      sh -c "npm install
      && npm run dev -- --host 0.0.0.0 --port 8080"

volumes:
  backend_node_modules:
  frontend_node_modules:
